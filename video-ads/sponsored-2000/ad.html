<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;700&family=IBM+Plex+Sans:wght@700&display=block" rel="stylesheet">
<style>
@font-face{font-family:'PlexDigits';font-weight:700;src:url(plex-digits.woff2)}
:root{--g:#1fa37a;--g2:#6fd3ae;--ink:#141414;--red:#f0564a;--blue:#3f5bd9;--yel:#ffc53d;--pink:#ff4f8b}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#f8f7f2;font-family:'IBM Plex Sans Arabic',sans-serif;color:var(--ink)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;
  background:radial-gradient(circle,#dcdcd4 2px,transparent 2.5px) 0 0/44px 44px,#f8f7f2}
.blob{position:absolute;border-radius:50%;filter:blur(90px)}
.b1{width:760px;height:760px;right:-200px;top:-80px;background:#9ee0c6;opacity:.75;animation:drift 26s ease-in-out both}
.b2{width:720px;height:720px;left:-220px;bottom:120px;background:#ffe3a3;opacity:.8;animation:drift2 26s ease-in-out both}
@keyframes drift{to{transform:translate(-120px,160px) scale(1.1)}}
@keyframes drift2{to{transform:translate(140px,-120px) scale(1.15)}}
#bar{position:absolute;top:0;left:0;height:10px;background:var(--g);animation:bar 25.8s linear both;transform-origin:right}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#bar{width:100%}
.tag{position:absolute;top:60px;left:60px;font-weight:700;font-size:26px;font-family:sans-serif;letter-spacing:4px;color:#8d8d86}
.tag:after{content:'';display:block;width:60px;height:5px;background:var(--g);margin-top:14px;border-radius:3px}
.sig{position:absolute;bottom:50px;right:60px;font-size:24px;color:#aaa}

.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;
  opacity:0;animation:scene var(--d) linear var(--s) both}
@keyframes scene{0%{opacity:0;filter:blur(18px);transform:scale(1.04)}7%{opacity:1;filter:blur(0);transform:scale(1)}
  90%{opacity:1;filter:blur(0)}100%{opacity:0;filter:blur(22px);transform:scale(.97)}}
.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) calc(var(--s) + var(--o,0s)) both}
@keyframes pop{from{opacity:0;transform:translateY(60px) scale(.6)}to{opacity:1;transform:none}}
.type{animation:type .9s steps(20) calc(var(--s) + var(--o,0s)) both;clip-path:inset(0 0 0 100%)}
@keyframes type{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
h1{font-weight:700;font-size:84px;line-height:1.35;text-align:center;padding:0 70px}
.hl{color:var(--g)}
.big{font-weight:700;font-size:170px;color:var(--g2);line-height:1.1}
.icon{width:250px;height:250px;border-radius:64px;background:var(--g);display:grid;place-items:center;
  box-shadow:0 0 0 26px rgba(31,163,122,.12),0 30px 60px rgba(31,163,122,.35)}
.icon svg{width:130px;height:130px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.price{font-weight:700;font-size:190px;font-family:'PlexDigits','DejaVu Sans';color:var(--g);direction:ltr;position:relative}
.strike:after{content:'';position:absolute;left:-20px;right:-20px;top:52%;height:16px;background:var(--red);border-radius:8px;
  transform-origin:left;animation:strike .5s ease-out calc(var(--s) + 1.6s) both}
@keyframes strike{from{transform:scaleX(0) rotate(-6deg)}to{transform:scaleX(1) rotate(-6deg)}}
.sub{font-size:58px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:34px}
.card{width:420px;height:330px;background:#fff;border-radius:44px;box-shadow:0 20px 50px rgba(0,0,0,.08);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;font-size:44px;font-weight:700}
.card i{width:130px;height:130px;border-radius:36px;background:var(--g);display:grid;place-items:center}
.card svg{width:72px;height:72px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dash{width:900px;height:620px;background:#141a17;border-radius:44px;padding:40px;box-shadow:0 40px 80px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:40px}
.dots{display:flex;gap:12px}.dots b{width:20px;height:20px;border-radius:50%;background:#f0564a}.dots b:nth-child(2){background:#ffc53d}.dots b:nth-child(3){background:#2ecf8f}
.kp{display:flex;gap:26px}.kp div{flex:1;height:90px;border-radius:18px;background:#1f2723;padding:28px 26px}
.kp span{display:block;height:26px;border-radius:13px}
.bars{flex:1;display:flex;align-items:flex-end;gap:26px}
.bars b{flex:1;background:#1e6b52;border-radius:14px 14px 6px 6px;transform-origin:bottom;animation:grow .7s ease-out both}
.bars b:last-child{background:#2ecf8f}
@keyframes grow{from{transform:scaleY(0)}}
.cta{background:var(--g);color:#fff;font-size:60px;font-weight:700;padding:34px 90px;border-radius:80px;box-shadow:0 25px 50px rgba(31,163,122,.4)}
.red{color:var(--red)}
.pulse{animation:pulse 1s ease-in-out calc(var(--s) + 1.2s) 3}
@keyframes pulse{50%{transform:scale(1.08)}}

.c{position:absolute;animation:conf var(--d) ease-out var(--s) both}
@keyframes conf{0%{opacity:0;transform:scale(0) rotate(-90deg)}8%{opacity:1;transform:scale(1.2) rotate(0)}14%{transform:scale(1)}
  88%{opacity:1;transform:translateY(-30px) rotate(40deg)}100%{opacity:0;transform:translateY(-40px) scale(.4) rotate(60deg)}}
</style>
</head>
<body>
<div id="stage">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div id="bar"></div>
  <div class="tag">SPONSORED ADS</div>
  <div id="confetti"></div>

  <!-- 1 -->
  <section class="scene" style="--s:0s;--d:3.2s">
    <h1 class="type" style="--o:.2s">تريد مشروعك يوصل</h1>
    <div class="big pop" style="--o:1.1s">لكل الناس؟</div>
  </section>

  <!-- 2 -->
  <section class="scene" style="--s:3.2s;--d:3.2s">
    <div class="icon pop" style="--o:.15s"><svg viewBox="0 0 24 24"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></div>
    <h1 class="pop" style="--o:.6s">بس ما عندك <span class="hl">وقت</span><br>تسوي إعلان؟</h1>
  </section>

  <!-- 3 -->
  <section class="scene" style="--s:6.4s;--d:3.9s">
    <div class="price strike pop" style="--o:.2s;font-size:160px">150,000</div>
    <div class="sub pop" style="--o:.7s">تكلفة فيديو إعلاني عادي</div>
  </section>

  <!-- 4 -->
  <section class="scene" style="--s:10.3s;--d:6.3s">
    <h1 class="pop" style="--o:.1s;font-size:76px">ويانا تحصل</h1>
    <div class="grid">
      <div class="card pop" style="--o:.9s"><i><svg viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3"/></svg></i>فيديو احترافي</div>
      <div class="card pop" style="--o:2.0s"><i><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-7"/></svg></i>إعلان ممول</div>
      <div class="card pop" style="--o:3.1s"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="8" cy="10" r="1.3"/><circle cx="12" cy="7.5" r="1.3"/><circle cx="16" cy="10" r="1.3"/></svg></i>بهوية براندك</div>
      <div class="card pop" style="--o:4.2s"><i><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></i>تسليم سريع</div>
    </div>
  </section>

  <!-- 5 -->
  <section class="scene" style="--s:16.6s;--d:3.2s">
    <div class="sub pop" style="--o:.1s">كل هذا بس بـ</div>
    <div class="price pop pulse" style="--o:.45s">2000</div>
    <div class="big pop" style="--o:.8s;font-size:120px;color:var(--g)">دينار فقط!</div>
  </section>

  <!-- 6 -->
  <section class="scene" style="--s:19.8s;--d:2.6s">
    <div class="dash pop" style="--o:.1s">
      <div class="dots"><b></b><b></b><b></b></div>
      <div class="kp"><div><span style="background:#2ecf8f"></span></div><div><span style="background:#3f5bd9"></span></div><div><span style="background:#ffc53d"></span></div></div>
      <div class="bars" id="bars"></div>
    </div>
    <h1 class="pop" style="--o:.6s;font-size:70px">وشوف <span class="hl">النتائج</span> بعينك</h1>
  </section>

  <!-- 7 -->
  <section class="scene" style="--s:22.4s;--d:3.4s">
    <h1 class="pop red" style="--o:.1s">لا تفوّت الفرصة!</h1>
    <div class="cta pop pulse" style="--o:.5s">راسلنا هسه 👈</div>
  </section>
  <div class="sig">إعلانك بـ 2000 دينار</div>
</div>
<script>
window.VO_START=[0.3,3.5,6.7,10.6,16.9,20.1,22.7];
// bars
const bars=document.getElementById('bars');
[30,45,38,58,52,72,66,100].forEach((h,i)=>{const b=document.createElement('b');b.style.height=h+'%';b.style.animationDelay=(20.1+i*.08)+'s';bars.appendChild(b)});
// deterministic confetti per scene
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const cols=['#f0564a','#3f5bd9','#1fa37a','#ffc53d','#ff4f8b','#17b3c9','#8a5cf6'];
const shapes=[
 c=>`<svg width="60" height="60" viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6" stroke="${c}" stroke-width="2.2" stroke-linecap="round"/></svg>`,
 c=>`<svg width="44" height="44"><circle cx="22" cy="22" r="16" fill="none" stroke="${c}" stroke-width="7"/></svg>`,
 c=>`<svg width="36" height="36"><circle cx="18" cy="18" r="18" fill="${c}"/></svg>`,
 c=>`<svg width="56" height="56" viewBox="0 0 10 10"><path d="M1 2l8 3-8 4z" fill="${c}"/></svg>`,
 c=>`<svg width="70" height="40" viewBox="0 0 14 8"><path d="M1 5q3-5 6 0t6 0" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/></svg>`,
 c=>`<svg width="56" height="56" viewBox="0 0 10 10"><path d="M5 0l1.3 3.7L10 5 6.3 6.3 5 10 3.7 6.3 0 5l3.7-1.3z" fill="${c}"/></svg>`,
 c=>`<svg width="60" height="60" viewBox="0 0 12 12">${[...Array(16)].map((_,i)=>`<circle cx="${1.5+(i%4)*3}" cy="${1.5+(i>>2)*3}" r="1" fill="${c}"/>`).join('')}</svg>`
];
const conf=document.getElementById('confetti');
document.querySelectorAll('.scene').forEach(sc=>{
  const s=sc.style.getPropertyValue('--s'),d=sc.style.getPropertyValue('--d');
  for(let k=0;k<11;k++){
    let x,y;do{x=rnd()*1000;y=150+rnd()*1650}while(x>150&&x<880&&y>560&&y<1400);
    const e=document.createElement('div');e.className='c';
    e.style.cssText=`left:${x}px;top:${y}px;--s:calc(${s} + ${(rnd()*.5).toFixed(2)}s);--d:${d}`;
    e.innerHTML=shapes[Math.floor(rnd()*shapes.length)](cols[Math.floor(rnd()*cols.length)]);
    conf.appendChild(e);
  }
});
window.seek=t=>{document.getAnimations().forEach(a=>{a.pause();a.currentTime=t*1000})};
window.DURATION=25.8;
</script>
</body>
</html>
